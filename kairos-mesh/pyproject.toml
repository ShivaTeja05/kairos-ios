[project]
name = "kairos-mesh"
version = "0.1.0"
description = "One agent across all your devices, each keeping its own data and its own veto."
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "httpx", "segno"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
