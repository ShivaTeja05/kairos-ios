<svg xmlns="http://www.w3.org/2000/svg" width="680" height="425" viewBox="0 0 680 425" role="img">
<title>Two-way Jarvis on iPhone and Mac with one shared context</title>
<desc>The iPhone and the MacBook each have a voice front end, a Kairos agent and hands. Between them, a shared brain on the hub holds one conversation from both devices, a task board, and a mesh relay that sends work both ways.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray rect{fill:#F1EFE8;stroke:#888780}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="425" fill="#ffffff"/>
<g class="c-gray"><rect x="30" y="40" width="200" height="330" rx="16" stroke-width="0.5"/><text class="th" x="130" y="64" text-anchor="middle" dominant-baseline="central">iPhone</text></g>
<g class="c-gray"><rect x="250" y="40" width="180" height="330" rx="16" stroke-width="0.5"/><text class="th" x="340" y="64" text-anchor="middle" dominant-baseline="central">Shared brain</text><text class="ts" x="340" y="82" text-anchor="middle" dominant-baseline="central">The hub, on the Mac</text></g>
<g class="c-gray"><rect x="450" y="40" width="200" height="330" rx="16" stroke-width="0.5"/><text class="th" x="550" y="64" text-anchor="middle" dominant-baseline="central">MacBook</text></g>
<g class="c-teal"><rect x="45" y="100" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="118" text-anchor="middle" dominant-baseline="central">Voice and text</text><text class="ts" x="130" y="138" text-anchor="middle" dominant-baseline="central">Talk, Siri, typing</text></g>
<g class="c-teal"><rect x="45" y="190" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="208" text-anchor="middle" dominant-baseline="central">Kairos agent</text><text class="ts" x="130" y="228" text-anchor="middle" dominant-baseline="central">57 tools, Face ID</text></g>
<g class="c-teal"><rect x="45" y="280" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="298" text-anchor="middle" dominant-baseline="central">Phone hands</text><text class="ts" x="130" y="318" text-anchor="middle" dominant-baseline="central">iCTRL: other apps</text></g>
<g class="c-coral"><rect x="265" y="100" width="150" height="56" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="th" x="340" y="118" text-anchor="middle" dominant-baseline="central">Conversation</text><text class="ts" x="340" y="138" text-anchor="middle" dominant-baseline="central">Both devices' turns</text></g>
<g class="c-coral"><rect x="265" y="190" width="150" height="56" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="th" x="340" y="208" text-anchor="middle" dominant-baseline="central">Task board</text><text class="ts" x="340" y="228" text-anchor="middle" dominant-baseline="central">Who, where, progress</text></g>
<g class="c-coral"><rect x="265" y="280" width="150" height="56" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="th" x="340" y="298" text-anchor="middle" dominant-baseline="central">Mesh relay</text><text class="ts" x="340" y="318" text-anchor="middle" dominant-baseline="central">Work both ways</text></g>
<g class="c-teal"><rect x="465" y="100" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="550" y="118" text-anchor="middle" dominant-baseline="central">Voice and text</text><text class="ts" x="550" y="138" text-anchor="middle" dominant-baseline="central">Voice page, typing</text></g>
<g class="c-coral"><rect x="465" y="190" width="170" height="56" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="th" x="550" y="208" text-anchor="middle" dominant-baseline="central">Mac agent</text><text class="ts" x="550" y="228" text-anchor="middle" dominant-baseline="central">Files, apps, research</text></g>
<g class="c-teal"><rect x="465" y="280" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="550" y="298" text-anchor="middle" dominant-baseline="central">Mac hands</text><text class="ts" x="550" y="318" text-anchor="middle" dominant-baseline="central">laptop_agent, OpenClaw</text></g>
<line x1="217" y1="128" x2="263" y2="128" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="463" y1="128" x2="417" y2="128" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="217" y1="218" x2="263" y2="218" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="463" y1="218" x2="417" y2="218" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="263" y1="300" x2="219" y2="244" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="417" y1="300" x2="461" y2="244" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="130" y1="158" x2="130" y2="188" class="arr" marker-end="url(#arrow)"/>
<line x1="130" y1="248" x2="130" y2="278" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="158" x2="550" y2="188" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="248" x2="550" y2="278" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="158" x2="340" y2="188" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect class="c-teal" x="190" y="392" width="16" height="12" rx="3" stroke-width="0.5"/>
<text class="ts" x="214" y="398" dominant-baseline="central">You already have it</text>
<rect class="c-coral" x="380" y="392" width="16" height="12" rx="3" stroke-width="1" stroke-dasharray="3 2"/>
<text class="ts" x="404" y="398" dominant-baseline="central">To build</text>
</svg>
