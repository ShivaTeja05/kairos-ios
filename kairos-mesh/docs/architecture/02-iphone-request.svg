<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" role="img">
<title>One request on the iPhone</title>
<desc>You ask; clear requests are matched by rules with no model, others go to Gemini which picks one of 57 tools; SafetyGate and OwnerPolicy check the proposal; risky actions show a Face ID card; the tool runs on the phone; the answer is built only from what actually happened.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="510" fill="#ffffff"/>
<g class="c-teal"><rect x="70" y="30" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="240" y="48" text-anchor="middle" dominant-baseline="central">You ask on the iPhone</text><text class="ts" x="240" y="68" text-anchor="middle" dominant-baseline="central">Siri, typing, or the Talk button</text></g>
<line x1="240" y1="88" x2="240" y2="108" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="70" y="110" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="240" y="128" text-anchor="middle" dominant-baseline="central">Rules first</text><text class="ts" x="240" y="148" text-anchor="middle" dominant-baseline="central">Clear requests: instant, offline, no model</text></g>
<line x1="240" y1="168" x2="240" y2="188" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="70" y="190" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="240" y="208" text-anchor="middle" dominant-baseline="central">Gemini picks a tool</text><text class="ts" x="240" y="228" text-anchor="middle" dominant-baseline="central">From the 57 tools, with the owner's key</text></g>
<line x1="240" y1="248" x2="240" y2="268" class="arr" marker-end="url(#arrow)"/>
<path d="M68 138 L45 138 L45 298 L68 298" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="70" y="270" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="240" y="288" text-anchor="middle" dominant-baseline="central">SafetyGate + OwnerPolicy</text><text class="ts" x="240" y="308" text-anchor="middle" dominant-baseline="central">Code checks the proposal, not the model</text></g>
<line x1="412" y1="298" x2="448" y2="298" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="450" y="270" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="550" y="288" text-anchor="middle" dominant-baseline="central">Face ID card</text><text class="ts" x="550" y="308" text-anchor="middle" dominant-baseline="central">Risky: you approve</text></g>
<path d="M550 328 L550 378 L412 378" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="240" y1="328" x2="240" y2="348" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="70" y="350" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="240" y="368" text-anchor="middle" dominant-baseline="central">Tool runs on the phone</text><text class="ts" x="240" y="388" text-anchor="middle" dominant-baseline="central">Calendar, alarms, contacts, or iCTRL apps</text></g>
<line x1="240" y1="408" x2="240" y2="428" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="70" y="430" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="240" y="448" text-anchor="middle" dominant-baseline="central">Answer from what happened</text><text class="ts" x="240" y="468" text-anchor="middle" dominant-baseline="central">Never says done unless a tool did it</text></g>
</svg>
