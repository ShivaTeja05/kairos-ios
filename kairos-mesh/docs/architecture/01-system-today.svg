<rect class="c-teal" x="150" y="544" width="16" height="12" rx="3" stroke-width="0.5"/>
<text class="ts" x="174" y="550" dominant-baseline="central">Your code</text>
<rect class="c-coral" x="270" y="544" width="16" height="12" rx="3" stroke-width="0.5"/>
