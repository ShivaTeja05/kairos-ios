<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img">
<title>How device data reaches the hub</title>
<desc>Apple Health, Android Health Connect, location and notification apps, and desktop agents push events into the Tempo hub's single SQLite event log. The ask endpoint, the MCP server and the Guardian read from that log.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#FAFAF7;stroke:#B4B2A9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="340" fill="#ffffff"/>
<g><rect class="box" x="30" y="30" width="180" height="52" rx="8" stroke-width="0.5"/><text class="th" x="120" y="47" text-anchor="middle" dominant-baseline="central">Apple Watch, iPhone</text><text class="ts" x="120" y="66" text-anchor="middle" dominant-baseline="central">Health Auto Export</text></g>
<g><rect class="box" x="30" y="102" width="180" height="52" rx="8" stroke-width="0.5"/><text class="th" x="120" y="119" text-anchor="middle" dominant-baseline="central">Android watches</text><text class="ts" x="120" y="138" text-anchor="middle" dominant-baseline="central">Health Connect</text></g>
<g><rect class="box" x="30" y="174" width="180" height="52" rx="8" stroke-width="0.5"/><text class="th" x="120" y="191" text-anchor="middle" dominant-baseline="central">Location, alerts</text><text class="ts" x="120" y="210" text-anchor="middle" dominant-baseline="central">OwnTracks, Tasker</text></g>
<g><rect class="box" x="30" y="246" width="180" height="52" rx="8" stroke-width="0.5"/><text class="th" x="120" y="263" text-anchor="middle" dominant-baseline="central">Mac, Windows, Linux</text><text class="ts" x="120" y="282" text-anchor="middle" dominant-baseline="central">Desktop agent</text></g>
<line x1="212" y1="56" x2="248" y2="56" class="arr" marker-end="url(#arrow)"/>
<line x1="212" y1="128" x2="248" y2="128" class="arr" marker-end="url(#arrow)"/>
<line x1="212" y1="200" x2="248" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="212" y1="272" x2="248" y2="272" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="250" y="30" width="180" height="268" rx="12" stroke-width="0.5"/><text class="th" x="340" y="140" text-anchor="middle" dominant-baseline="central">Tempo hub :8787</text><text class="ts" x="340" y="164" text-anchor="middle" dominant-baseline="central">One event log</text><text class="ts" x="340" y="182" text-anchor="middle" dominant-baseline="central">(SQLite)</text></g>
<line x1="432" y1="70" x2="468" y2="70" class="arr" marker-end="url(#arrow)"/>
<line x1="432" y1="164" x2="468" y2="164" class="arr" marker-end="url(#arrow)"/>
<line x1="432" y1="258" x2="468" y2="258" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="470" y="42" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="60" text-anchor="middle" dominant-baseline="central">Ask (/api/ask)</text><text class="ts" x="560" y="80" text-anchor="middle" dominant-baseline="central">Model + search tools</text></g>
<g class="c-teal"><rect x="470" y="136" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="154" text-anchor="middle" dominant-baseline="central">MCP server</text><text class="ts" x="560" y="174" text-anchor="middle" dominant-baseline="central">Other agents read it</text></g>
<g class="c-teal"><rect x="470" y="230" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="248" text-anchor="middle" dominant-baseline="central">Guardian</text><text class="ts" x="560" y="268" text-anchor="middle" dominant-baseline="central">Watches every event</text></g>
</svg>
