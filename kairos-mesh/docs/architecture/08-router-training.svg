<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img">
<title>kairos-router fine-tuning pipeline</title>
<desc>Tool schemas are extracted from the app, a local teacher model writes examples, code checks every example and rejects failures with a reason, then a LoRA fine-tune runs, a pre-registered eval compares it with base models, and the model ships to Ollama and Hugging Face.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-gray rect{fill:#F1EFE8;stroke:#888780}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="540" fill="#ffffff"/>
<g class="c-purple"><rect x="60" y="30" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="230" y="48" text-anchor="middle" dominant-baseline="central">Extract tool schemas</text><text class="ts" x="230" y="68" text-anchor="middle" dominant-baseline="central">57 phone tools + hub tools, one JSON file</text></g>
<line x1="230" y1="88" x2="230" y2="108" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="60" y="110" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="230" y="128" text-anchor="middle" dominant-baseline="central">Teacher writes examples</text><text class="ts" x="230" y="148" text-anchor="middle" dominant-baseline="central">qwen3.5:35b on the Mac: EN, HI, TE, attacks</text></g>
<line x1="230" y1="168" x2="230" y2="188" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="60" y="190" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="230" y="208" text-anchor="middle" dominant-baseline="central">Code checks every example</text><text class="ts" x="230" y="228" text-anchor="middle" dominant-baseline="central">Schema, rules and SafetyGate must agree</text></g>
<line x1="402" y1="218" x2="438" y2="218" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="440" y="190" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="540" y="208" text-anchor="middle" dominant-baseline="central">Rejected</text><text class="ts" x="540" y="228" text-anchor="middle" dominant-baseline="central">Logged with the reason</text></g>
<line x1="230" y1="248" x2="230" y2="268" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="60" y="270" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="230" y="288" text-anchor="middle" dominant-baseline="central">Fine-tune: SFT, then RL</text><text class="ts" x="230" y="308" text-anchor="middle" dominant-baseline="central">The safety gate's checks are the reward</text></g>
<line x1="230" y1="328" x2="230" y2="348" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="60" y="350" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="230" y="368" text-anchor="middle" dominant-baseline="central">Pre-registered eval</text><text class="ts" x="230" y="388" text-anchor="middle" dominant-baseline="central">Human-written test set vs base models</text></g>
<line x1="230" y1="408" x2="230" y2="428" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="60" y="430" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="230" y="448" text-anchor="middle" dominant-baseline="central">Ship the model</text><text class="ts" x="230" y="468" text-anchor="middle" dominant-baseline="central">Ollama for the hub, Hugging Face card</text></g>
<rect class="c-purple" x="220" y="506" width="16" height="12" rx="3" stroke-width="0.5"/>
<text class="ts" x="244" y="512" dominant-baseline="central">Data</text>
<rect class="c-teal" x="320" y="506" width="16" height="12" rx="3" stroke-width="0.5"/>
<text class="ts" x="344" y="512" dominant-baseline="central">Model</text>
</svg>
