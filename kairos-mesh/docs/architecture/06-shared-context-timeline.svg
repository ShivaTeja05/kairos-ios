<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img">
<title>Start a task on the iPhone, ask about it on the Mac</title>
<desc>At 10:00 you ask on the iPhone to find flights to Delhi under 600 pounds; a worker moves to the Mac to search; at 10:03 it reports 3 flights; at 10:05 you ask the Mac how it is going and the shared brain gives the Mac the full context; at 10:08 the result goes to whichever device you are using.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="430" fill="#ffffff"/>
<g class="c-teal"><rect x="40" y="20" width="140" height="44" rx="8" stroke-width="0.5"/><text class="th" x="110" y="42" text-anchor="middle" dominant-baseline="central">iPhone</text></g>
<g class="c-coral"><rect x="270" y="20" width="140" height="44" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Shared brain</text></g>
<g class="c-teal"><rect x="500" y="20" width="140" height="44" rx="8" stroke-width="0.5"/><text class="th" x="570" y="42" text-anchor="middle" dominant-baseline="central">MacBook</text></g>
<line x1="110" y1="66" x2="110" y2="410" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="340" y1="66" x2="340" y2="410" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="570" y1="66" x2="570" y2="410" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="20" y="110" dominant-baseline="central">10:00</text>
<text class="ts" x="225" y="96" text-anchor="middle">Find flights to Delhi under £600</text>
<line x1="112" y1="110" x2="338" y2="110" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="20" y="165" dominant-baseline="central">10:01</text>
<text class="ts" x="455" y="151" text-anchor="middle">Worker moves to the Mac</text>
<line x1="342" y1="165" x2="568" y2="165" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="20" y="220" dominant-baseline="central">10:03</text>
<text class="ts" x="455" y="206" text-anchor="middle">3 flights found so far</text>
<line x1="568" y1="220" x2="342" y2="220" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="20" y="275" dominant-baseline="central">10:05</text>
<text class="ts" x="455" y="261" text-anchor="middle">How's my flight search going?</text>
<line x1="568" y1="275" x2="342" y2="275" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="455" y="316" text-anchor="middle">Started on iPhone, 3 found, £540</text>
<line x1="342" y1="330" x2="568" y2="330" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="20" y="385" dominant-baseline="central">10:08</text>
<text class="ts" x="225" y="371" text-anchor="middle">Done, if you're here</text>
<line x1="338" y1="385" x2="112" y2="385" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="455" y="371" text-anchor="middle">Done, if you're here</text>
<line x1="342" y1="385" x2="568" y2="385" class="arr" marker-end="url(#arrow)"/>
</svg>
