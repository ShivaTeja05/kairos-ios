<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img">
<title>Keyless Kairos model stack</title>
<desc>Open models split between the iPhone and the Mac with no cloud API keys: rules, on-device OCR, speech and a small fine-tuned router on the phone, which hands harder requests to a larger fine-tuned router, a vision model, local voice and self-hosted search on the Mac.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray rect{fill:#F1EFE8;stroke:#888780}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="480" fill="#ffffff"/>
<g class="c-gray"><rect x="200" y="30" width="280" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">No cloud API keys</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">Gemini, ElevenLabs, Google removed</text></g>
<g class="c-gray"><rect x="40" y="110" width="270" height="304" rx="16" stroke-width="0.5"/><text class="th" x="60" y="132" dominant-baseline="central">iPhone: works offline</text></g>
<g class="c-gray"><rect x="370" y="110" width="270" height="304" rx="16" stroke-width="0.5"/><text class="th" x="390" y="132" dominant-baseline="central">Mac: Ollama + open tools</text></g>
<g class="c-teal"><rect x="60" y="150" width="230" height="52" rx="8" stroke-width="0.5"/><text class="th" x="175" y="167" text-anchor="middle" dominant-baseline="central">Rules first</text><text class="ts" x="175" y="186" text-anchor="middle" dominant-baseline="central">Instant, offline, exists</text></g>
<g class="c-coral"><rect x="60" y="214" width="230" height="52" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="th" x="175" y="231" text-anchor="middle" dominant-baseline="central">Apple Vision OCR</text><text class="ts" x="175" y="250" text-anchor="middle" dominant-baseline="central">Reads letters on-device</text></g>
<g class="c-coral"><rect x="60" y="278" width="230" height="52" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="th" x="175" y="295" text-anchor="middle" dominant-baseline="central">WhisperKit speech</text><text class="ts" x="175" y="314" text-anchor="middle" dominant-baseline="central">Open source, on-device</text></g>
<g class="c-coral"><rect x="60" y="342" width="230" height="52" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="th" x="175" y="359" text-anchor="middle" dominant-baseline="central">kairos-router, small</text><text class="ts" x="175" y="378" text-anchor="middle" dominant-baseline="central">Fine-tuned, llama.cpp</text></g>
<g class="c-coral"><rect x="390" y="150" width="230" height="52" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="th" x="505" y="167" text-anchor="middle" dominant-baseline="central">kairos-router 4B</text><text class="ts" x="505" y="186" text-anchor="middle" dominant-baseline="central">Fine-tuned tool caller</text></g>
<g class="c-teal"><rect x="390" y="214" width="230" height="52" rx="8" stroke-width="0.5"/><text class="th" x="505" y="231" text-anchor="middle" dominant-baseline="central">qwen3.5:35b</text><text class="ts" x="505" y="250" text-anchor="middle" dominant-baseline="central">Vision, research, teacher</text></g>
<g class="c-teal"><rect x="390" y="278" width="230" height="52" rx="8" stroke-width="0.5"/><text class="th" x="505" y="295" text-anchor="middle" dominant-baseline="central">Piper + Whisper voice</text><text class="ts" x="505" y="314" text-anchor="middle" dominant-baseline="central">Your Telugu, Hindi voices</text></g>
<g class="c-coral"><rect x="390" y="342" width="230" height="52" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="th" x="505" y="359" text-anchor="middle" dominant-baseline="central">SearXNG search</text><text class="ts" x="505" y="378" text-anchor="middle" dominant-baseline="central">Self-hosted, no key</text></g>
<line x1="292" y1="364" x2="388" y2="180" class="arr" marker-end="url(#arrow)"/>
<rect class="c-teal" x="200" y="440" width="16" height="12" rx="3" stroke-width="0.5"/>
<text class="ts" x="224" y="446" dominant-baseline="central">You already have it</text>
<rect class="c-coral" x="370" y="440" width="16" height="12" rx="3" stroke-width="1" stroke-dasharray="3 2"/>
<text class="ts" x="394" y="446" dominant-baseline="central">To build</text>
</svg>
