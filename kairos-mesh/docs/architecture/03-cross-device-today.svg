<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img">
<title>Cross-device path today</title>
<desc>The Talk button starts an ElevenLabs voice call; the voice agent's phone task tool goes through the ngrok tunnel to the voice server on the Mac; the conductor splits the request into a hub agent, a laptop agent and a phone agent that operates iPhone apps through iCTRL; their answers are combined and spoken back.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="560" fill="#ffffff"/>
<g class="c-teal"><rect x="190" y="30" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">Talk on the iPhone</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">Kairos app starts a voice call</text></g>
<line x1="340" y1="88" x2="340" y2="108" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="190" y="110" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="128" text-anchor="middle" dominant-baseline="central">ElevenLabs voice agent</text><text class="ts" x="340" y="148" text-anchor="middle" dominant-baseline="central">Hears you, calls its phone_task tool</text></g>
<line x1="340" y1="168" x2="340" y2="188" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="190" y="190" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="208" text-anchor="middle" dominant-baseline="central">Voice server on the Mac</text><text class="ts" x="340" y="228" text-anchor="middle" dominant-baseline="central">Through ngrok, phone key checked</text></g>
<line x1="340" y1="248" x2="340" y2="268" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="190" y="270" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="288" text-anchor="middle" dominant-baseline="central">Conductor plans</text><text class="ts" x="340" y="308" text-anchor="middle" dominant-baseline="central">Up to 5 sub-tasks, run at once</text></g>
<path d="M340 328 L340 346 M130 368 L130 346 L550 346 L550 368" fill="none" stroke="#888780" stroke-width="1"/>
<line x1="130" y1="346" x2="130" y2="368" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="346" x2="340" y2="368" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="346" x2="550" y2="368" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="370" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="388" text-anchor="middle" dominant-baseline="central">Hub agent</text><text class="ts" x="130" y="408" text-anchor="middle" dominant-baseline="central">Ollama reads your events</text></g>
<g class="c-teal"><rect x="250" y="370" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="388" text-anchor="middle" dominant-baseline="central">Laptop agent</text><text class="ts" x="340" y="408" text-anchor="middle" dominant-baseline="central">Files, apps, battery</text></g>
<g class="c-teal"><rect x="460" y="370" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="550" y="388" text-anchor="middle" dominant-baseline="central">Phone agent</text><text class="ts" x="550" y="408" text-anchor="middle" dominant-baseline="central">iCTRL taps iPhone apps</text></g>
<path d="M130 428 L130 446 L550 446 L550 428 M340 428 L340 446" fill="none" stroke="#888780" stroke-width="1"/>
<line x1="340" y1="446" x2="340" y2="468" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="190" y="470" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="488" text-anchor="middle" dominant-baseline="central">Answers combined, spoken</text><text class="ts" x="340" y="508" text-anchor="middle" dominant-baseline="central">Back through the ElevenLabs call</text></g>
</svg>
